<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1240" height="376" viewBox="0 0 1240 376" role="img" aria-labelledby="title desc">
  <title id="title">System Bio Mon</title>
  <desc id="desc">A cyan pulse is etched into an exploded processor above a dark circuit board. System Bio Mon monitors Windows hardware and game frame timing.</desc>
